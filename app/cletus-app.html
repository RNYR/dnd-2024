<title>Cletus Companion</title>

<style>
/* Layout: phone-first single column; fixed bottom tab bar; bottom sheets. Monochrome: ink on paper, one weight of line, no color accents. */
:root {
  --paper: #fafafa;
  --panel: #ffffff;
  --ink: #111111;
  --muted: #6e6e6e;
  --line: #e3e3e3;
  --moss: #111111;
  --moss-ink: #ffffff;
  --ember: #111111;
  --ember-ink: #ffffff;
  --chip: #f0f0f0;
  --bad: #111111;
  --good: #111111;
  --shade: rgba(0, 0, 0, .4);
  --display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --label: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d0d0d; --panel: #151515; --ink: #ededed; --muted: #8f8f8f; --line: #2a2a2a;
    --moss: #ededed; --moss-ink: #0d0d0d; --ember: #ededed; --ember-ink: #0d0d0d; --chip: #222222;
    --bad: #ededed; --good: #ededed; --shade: rgba(0, 0, 0, .65); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d0d0d; --panel: #151515; --ink: #ededed; --muted: #8f8f8f; --line: #2a2a2a;
  --moss: #ededed; --moss-ink: #0d0d0d; --ember: #ededed; --ember-ink: #0d0d0d; --chip: #222222;
  --bad: #ededed; --good: #ededed; --shade: rgba(0, 0, 0, .65); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body {
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; letter-spacing: -0.005em;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(96px + env(safe-area-inset-bottom, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 12px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.brand small { font-family: var(--body); font-size: 13px; color: var(--muted); display: block; }
.status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; text-align: right; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.status.ok i { background: var(--ink); }
.status.warn i { background: transparent; border: 1.5px solid var(--ink); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; min-width: 0; }
h2 { font-family: var(--label); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
h3 { font-family: var(--label); font-size: 15px; font-weight: 600; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stack { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cols { display: grid; gap: 12px; }
@media (min-width: 760px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 9px 12px; min-height: 42px; font-weight: 500; }
.btn.pri { background: var(--moss); color: var(--moss-ink); border-color: var(--moss); }
.btn.hot { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.sm { min-height: 34px; padding: 5px 10px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.full { width: 100%; }

/* Vitals */
.vit { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px; text-align: center; display: grid; gap: 2px; align-content: center; }
.tile .lbl, .lbl { font-family: var(--label); font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
button.tile { font: inherit; color: inherit; cursor: pointer; }
.tile .big { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: 12px; color: var(--muted); }
.hp-tile { border-color: var(--ink); }
.hp-tile .big { font-size: 36px; }
.hp-bar { height: 3px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.hp-bar b { display: block; height: 100%; background: var(--moss); }
.hp-bar b.low { background: repeating-linear-gradient(90deg, var(--ink) 0 4px, transparent 4px 7px); }
.hp-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.banner { border-radius: 4px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1.5px solid var(--ink); background: var(--panel); }
.banner b { color: var(--ink); }
.down { border-width: 2px; }
.down b { color: var(--bad); }

/* Trackers */
.trk { display: grid; gap: 6px; }
.trk-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.trk-row:last-child { border-bottom: 0; }
.trk-name { min-width: 0; }
.trk-name .small { display: block; }
.pips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pip { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--ink); background: transparent; padding: 0; }
.pip.used { background: transparent; border-style: dashed; border-color: var(--muted); }
.pip.full { background: var(--moss); }
.pip.sq { border-radius: 6px; }
.pip.dsx { border-color: var(--ink); border-radius: 2px; }
.pip.dsx.full { background: var(--ink); }
.pip.dsg { border-color: var(--ink); }
.pip.dsg.full { background: var(--ink); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper .btn { width: 38px; padding: 0; min-height: 34px; }
.stepper b { min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 4px 10px; font-size: 14px; min-height: 32px; }
.chip.on { background: var(--ember); color: var(--ember-ink); border-color: var(--ember); }
.tag { display: inline-block; font-size: 11px; font-family: var(--label); letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); white-space: nowrap; vertical-align: middle; }
.tag.c { background: var(--ember); color: var(--ember-ink); }
.tag.g { background: var(--moss); color: var(--moss-ink); }
.bonus-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
label.f.inline { grid-template-columns: auto auto; align-items: center; gap: 6px; }
input.die.sm { width: 64px; font-size: 18px; min-height: 38px; }
.cond-notes { display: grid; gap: 4px; font-size: 14px; }

/* Attack list */
.atk { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.atk:last-child { border-bottom: 0; }
.atk .nm { font-weight: 700; }
.atk .meta { font-size: 13px; color: var(--muted); grid-column: 1; }
.atk .acts { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; }

/* Spells */
.spell { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.spell:last-child { border-bottom: 0; }
.spell .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.spell .meta { font-size: 13px; color: var(--muted); }
.spell .desc { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.spell.open .desc { -webkit-line-clamp: unset; display: block; color: var(--ink); }
.sp-name { border: 0; background: transparent; padding: 0; text-align: left; display: grid; gap: 2px; min-width: 0; flex: 1; }
.sp-name .meta { font-size: 13px; color: var(--muted); }
.grp { font-family: var(--label); font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 8px 0 2px; }

/* Inventory */
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.item:last-child { border-bottom: 0; }
.item .nm { font-weight: 500; overflow-wrap: anywhere; }
.item .note { font-size: 13px; color: var(--muted); grid-column: 1; overflow-wrap: anywhere; }
.item .stepper { grid-row: 1 / span 2; grid-column: 2; }
.coins { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.coin { text-align: center; border: 1px solid var(--line); border-radius: 4px; padding: 6px 2px; display: grid; gap: 4px; }
.coin input { width: 100%; text-align: center; border: 0; background: transparent; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0; }

/* Notes */
.note-card { text-align: left; width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 10px 12px; display: grid; gap: 4px; }
.note-card .body { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Sheet */
.ab-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ab { border: 1px solid var(--line); border-radius: 4px; padding: 8px 4px; text-align: center; background: var(--panel); }
.ab .m { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.lst { display: grid; }
.lst button { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; text-align: left; padding: 7px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; min-height: 38px; }
.lst button:last-child { border-bottom: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dot.p { background: var(--moss); border-color: var(--moss); }
.dot.e { background: var(--ink); border-color: var(--ink); box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--ink); }
.feat { padding: 8px 0; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.feat:last-child { border-bottom: 0; }
.feat p { font-size: 14px; }
.prose { display: grid; gap: 8px; font-size: 15px; max-width: 68ch; }

/* Form */
label.f { display: grid; gap: 4px; font-size: 14px; }
input.in, select.in, textarea.in { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 4px; padding: 9px 10px; min-height: 42px; }
textarea.in { min-height: 160px; resize: vertical; }
input.die { width: 76px; text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; min-height: 38px; }
.seg button.on { background: var(--moss); color: var(--moss-ink); }
.opt { display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.opt:last-child { border-bottom: 0; }
.opt input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--moss); }
.opt.dis { opacity: .5; }
.opt .small { display: block; }

/* Roll result */
.result { border: 1.5px solid var(--ink); border-radius: 4px; padding: 12px; text-align: center; display: grid; gap: 4px; }
.result .total { font-size: 44px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.result.crit { border-width: 3px; }
.result.fail { border-style: dashed; }
.breakdown { font-size: 14px; color: var(--muted); }

/* Tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: 1fr 1.2fr 1fr;
  padding: 4px max(6px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
}
.tabs button { border: 0; background: transparent; padding: 6px 2px; min-height: 52px; display: grid; justify-items: center; gap: 3px; font-family: var(--label); font-size: 11px; font-weight: 500; letter-spacing: .02em; color: var(--muted); }
.tabs button svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--ink); font-weight: 600; }
.tabs .roll-tab { color: var(--ink); font-weight: 600; }
.tabs .roll-tab span { display: grid; place-items: center; width: 56px; height: 32px; border-radius: 4px; background: var(--ink); color: var(--paper); }
.tabs .roll-tab span svg { width: 20px; height: 20px; }
.subnav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); }
.subnav button { border: 0; background: transparent; padding: 8px 4px; min-height: 40px; font-weight: 500; color: var(--muted); }
.subnav button + button { border-left: 1px solid var(--line); }
.subnav button.on { background: var(--ink); color: var(--paper); font-weight: 600; }

/* Bottom sheet */
.ov { position: fixed; inset: 0; z-index: 40; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--paper); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; border-radius: 8px 8px 0 0;
  padding: 14px max(14px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  display: grid; gap: 12px; align-content: start;
}
.sheet .sh-hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: -14px; background: var(--paper); padding: 4px 0; z-index: 1; }
.sheet .sh-hd h3 { font-size: 19px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 4px; font-size: 14px; max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 30px 10px; display: grid; gap: 8px; justify-items: center; }
.wiz-steps { display: flex; gap: 4px; }
.wiz-steps i { flex: 1; height: 2px; border-radius: 2px; background: var(--line); }
.wiz-steps i.on { background: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .sheet.anim { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>

<div class="wrap" id="app">

</nav>

<script>
(() => {
'use strict';

/* ---------------- Rules data (2024 PHB, summarized) ---------------- */
const AB = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
const ABN = { str: 'Strength', dex: 'Dexterity', con: 'Constitution', int: 'Intelligence', wis: 'Wisdom', cha: 'Charisma' };
const SKILLS = [
  ['athletics', 'Athletics', 'str'], ['acrobatics', 'Acrobatics', 'dex'], ['sleight', 'Sleight of Hand', 'dex'], ['stealth', 'Stealth', 'dex'],

];

// Warlock progression by level (index = level)

// [id, name, level, time, range, concentration, summary, source]  source: w = warlock list, fey = Archfey, mi = Magic Initiate, x = feature
const SPELL_ROWS = [
  ['bladeWard', 'Blade Ward', 0, 'Action', 'Self', 1, 'For 1 minute, attackers subtract 1d4 from attack rolls against you.', 'w'],
  ['chillTouch', 'Chill Touch', 0, 'Action', 'Touch', 0, 'Melee spell attack: 1d10 Necrotic, and the target can\'t regain HP until the end of your next turn.', 'w'],

  ['light', 'Light', 0, 'Action', 'Touch', 0, 'The pipe bowl glows: bright light 20 ft, dim light 20 ft more, for 1 hour.', 'mi'],
  ['healingWord', 'Healing Word', 1, 'Bonus', '60 ft', 0, 'Heal 2d4 + CHA. +2d4 per slot level above 1. "Git up, ya big baby."', 'mi'],
  ['mageArmor', 'Mage Armor', 1, 'Action', 'Self', 0, 'AC 13 + Dex for 8 hours. Armor of Shadows: at will, no slot.', 'x'],

  rows.push(['Free Healing Word', 'Magic Initiate · Long Rest', pipsU(1, 'freeHW')]);
  if (d.has('feyTouched')) { rows.push(['Fey Touched: Misty Step', 'Free cast · Long Rest', pipsU(1, 'feyT')]); rows.push([`Fey Touched: ${esc(featChoice('feyTouched') || 'chosen spell')}`, 'Free cast · Long Rest', pipsU(1, 'feyT2')]); }
  if (d.has('shadowTouched')) { rows.push(['Shadow Touched: Invisibility', 'Free cast · Long Rest', pipsU(1, 'shadowT')]); rows.push([`Shadow Touched: ${esc(featChoice('shadowTouched') || 'chosen spell')}`, 'Free cast · Long Rest', pipsU(1, 'shadowT2')]); }
  if (d.has('lucky')) rows.push(['Luck Points', 'Lucky: Advantage or impose Disadvantage · Long Rest', pipsU(d.pb, 'luck')]);
  if (d.L >= 10) rows.push(['Beguiling Defenses', 'Reaction: halve a hit, psychic back · Long Rest or a Pact slot', pipsU(1, 'beguile')]);
  if (d.L >= 9) rows.push(['Contact Patron', 'Free Contact Other Plane · Long Rest', pipsU(1, 'patron')]);
  Object.keys(ARCANUM).forEach(k => { const lvl = ARCANUM[k]; const sid = c.arcanum[lvl]; if (sid && SP[sid]) rows.push([`Arcanum: ${SP[sid].n}`, `Level ${lvl} · Long Rest`, pipsU(1, 'arc' + lvl)]); });
  rows.push(['Heroic Inspiration', 'Reroll any die · back on a Long Rest', `<button class="pip sq ${c.heroic ? 'full' : 'used'}" data-act="heroic" aria-label="Heroic Inspiration ${c.heroic ? 'available' : 'used'}"></button>`]);
  rows.push(['Healer\'s Kit', 'Battle Medic uses', `<div class="stepper"><button class="btn" data-act="kit" data-d="-1" aria-label="Use one">−</button><b>${c.healerKit}</b><button class="btn" data-act="kit" data-d="1" aria-label="Add one">+</button></div>`]);
  rows.push(['Hit Dice', `d8 · ${d.L - c.hdSpent} of ${d.L} left`, pips(d.L, c.hdSpent, 'hd', 'sq')]);
  h += `<div class="card"><h2>Resources</h2><div class="trk">${rows.map(r => `<div class="trk-row"><div class="trk-name"><b>${r[0]}</b><span class="small muted">${r[1]}</span></div>${r[2]}</div>`).join('')}</div></div>`;

  if (down || c.deathS || c.deathF) {

  }

  const active = c.conditions || [];
  const condList = S.showConds ? CONDITIONS : CONDITIONS.filter(x => active.includes(x[0]));
  h += `<div class="card"><h2>Conditions <button class="btn sm" data-act="condToggle" aria-expanded="${S.showConds}">${S.showConds ? 'Done' : 'Add'}</button></h2><div class="chips">${condList.length ? condList.map(x => `<button class="chip ${active.includes(x[0]) ? 'on' : ''}" data-act="cond" data-id="${x[0]}" aria-pressed="${active.includes(x[0])}">${x[1]}${!S.showConds ? ' ×' : ''}</button>`).join('') : '<span class="muted small">None. Tap Add to mark one.</span>'}</div>
    <div class="spread" style="margin-top:10px"><div><b>Exhaustion</b> <span class="small muted">${c.exhaustion ? (c.exhaustion >= 6 ? 'Level 6: death' : `−${2 * c.exhaustion} to d20 tests, −${5 * c.exhaustion} ft speed`) : 'None'}</span></div><div class="stepper"><button class="btn" data-act="exh" data-d="-1" aria-label="Less exhaustion">−</button><b>${c.exhaustion}</b><button class="btn" data-act="exh" data-d="1" aria-label="More exhaustion">+</button></div></div>
    ${active.length ? `<div class="cond-notes" style="margin-top:10px">${active.map(id => `<p><b>${COND[id][1]}:</b> ${COND[id][2]}</p>`).join('')}${active.includes('charmed') && d.L >= 10 ? '<p class="muted small">Beguiling Defenses makes Cletus immune to Charmed.</p>' : ''}</div>` : ''}
  </div>`;

  h += `<div class="grid2"><button class="btn full" data-act="shortRest">Short Rest</button><button class="btn full pri" data-act="longRest">Long Rest</button></div>`;
  return `<div class="stack">${h}</div>`;
}
function pipsDS(n, act, cls) {

  return `<div class="pips">${h}</div>`;
}

const NOTE_TAGS = ['NPC', 'Place', 'Clue', 'Quest', 'Loot', 'Session'];
const NOTES_LS = LS_KEY + '-notes';
function readPending() { try { const v = JSON.parse(localStorage.getItem(NOTES_LS) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function writePending(list) { try { localStorage.setItem(NOTES_LS, JSON.stringify(list)); } catch (e) {} }
function allNotes() {
  const pend = readPending();
  const replaced = new Set(pend.map(p => p.cloudId).filter(Boolean));
  return pend.map(p => Object.assign({}, p, { pending: true })).concat(S.notes.filter(n => !replaced.has(n.id))).sort((a, b) => (b.updated || 0) - (a.updated || 0));
}
async function syncPending() {
  if (!S.notesCol || S.syncingNotes) return;
  const pend = readPending(); if (!pend.length) return;
  S.syncingNotes = true;
  for (const p of pend) {
    try {
      const body = { title: p.title || '', tag: p.tag || 'NPC', body: p.body || '', created: p.created || Date.now(), updated: p.updated || Date.now() };
      await S.notesCol.doc(p.cloudId || p.id).set(body);
      writePending(readPending().filter(x => x.id !== p.id));
    } catch (e) { break; }
  }
  S.syncingNotes = false;
  if (S.tab === 'notes' && !S.layer) render();
}
function viewNotes() {
  const q = S.noteQuery.trim().toLowerCase();
  const notes = allNotes();
  const list = notes.filter(n => (S.noteTag === 'all' || n.tag === S.noteTag) && (!q || ((n.title || '') + ' ' + (n.body || '')).toLowerCase().includes(q)));
  let h = `<div class="row"><input class="in" id="noteSearch" placeholder="Search notes" value="${esc(S.noteQuery)}" style="flex:1;min-width:0" aria-label="Search notes"><button class="btn pri" data-act="note" data-id="">New note</button></div>`;
  h += `<div class="chips">${['all'].concat(NOTE_TAGS).map(t => `<button class="chip ${S.noteTag === t ? 'on' : ''}" data-act="noteTag" data-t="${t}">${t === 'all' ? 'All' : t}</button>`).join('')}</div>`;
  const pendingCount = notes.filter(n => n.pending).length;
  if (!S.notesCol || S.notesError) h += `<div class="card"><p class="small muted">Offline: notes are kept on this device and sync when the app reaches the cloud again.</p></div>`;
  else if (pendingCount) h += `<div class="card"><p class="small muted">${pendingCount} note${pendingCount > 1 ? 's' : ''} waiting to sync.</p></div>`;
  if (S.notesCol && !S.notesReady && !pendingCount) h += '<div class="card"><p class="muted">Loading notes…</p></div>';
  else if (!notes.length) h += '<div class="card empty"><h3>No notes yet</h3><p class="muted">Jot down NPCs, places and clues from Barovia. Tap "New note" to start.</p></div>';
  else if (!list.length) h += '<div class="card"><p class="muted">No notes match.</p></div>';
  else h += list.map(n => `<button class="note-card" data-act="note" data-id="${n.id}"><div class="spread"><b>${esc(n.title || 'Untitled')}</b><span class="row" style="gap:4px">${n.pending ? '<span class="tag">Not synced</span>' : ''}<span class="tag">${esc(n.tag || 'Note')}</span></span></div><div class="body">${esc(n.body || '')}</div><span class="small muted">${new Date(n.updated || n.created || Date.now()).toLocaleDateString()}</span></button>`).join('');
  return `<div class="stack">${h}</div>`;
}

  out.push(['Pact Magic', `${d.slots} slot${d.slots > 1 ? 's' : ''} of level ${d.slotLvl}; regain on a Short or Long Rest.`]);

  if (L >= 3) out.push(['Steps of the Fey', `Cast Misty Step free ${d.steps} times per Long Rest. Add Refreshing Step (1d10 temp HP to you or an ally within 10 ft) or Taunting Step (creatures within 5 ft of where you left: Wis save or Disadvantage on attacks against anyone but you)${L >= 6 ? ', Disappearing Step (Invisible until your next turn) or Dreadful Step (creatures within 5 ft of where you left or arrive: Wis save or 2d10 Psychic)' : ''}.`, 'Archfey']);

/* ---------------- Layers (bottom sheets) ---------------- */
function openLayer(layer) { S.layer = layer; renderLayer(); }
function closeLayer() { S.layer = null; $('#layer').innerHTML = ''; }
function renderLayer() {
  if (S.inLayerRender) return; // a blur fired by the redraw itself must not redraw again
  S.inLayerRender = true;
  try { renderLayerNow(); } finally { S.inLayerRender = false; }
}
function renderLayerNow() {
  const L = S.layer; if (!L) { $('#layer').innerHTML = ''; return; }
  const fn = { hp: layerHP, roll: layerRoll, cast: layerCast, item: layerItem, note: layerNote, short: layerShort, long: layerLong, level: layerLevel, undo: layerUndo, msg: layerMsg, importConfirm: layerImport }[L.type];
  const body = fn(L);
  const prevScroll = $('#layer .sheet') ? $('#layer .sheet').scrollTop : 0;
  const active = document.activeElement;
  const activeId = active && active.id && $('#layer').contains(active) ? active.id : null;
  const caret = activeId && active.selectionStart != null ? active.selectionStart : null;
  $('#layer').innerHTML = `<div class="ov" data-act="ovClose"><div class="sheet${L._shown ? '' : ' anim'}" role="dialog" aria-modal="true" aria-label="${esc(body.title)}"><div class="sh-hd"><h3>${body.title}</h3><button class="btn sm ghost" data-act="close">Close</button></div>${body.html}</div></div>`;
  L._shown = true;
  const sh = $('#layer .sheet'); if (sh) sh.scrollTop = prevScroll;
  if (activeId) { const el = document.getElementById(activeId); if (el) { el.focus(); if (caret != null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch (e) {} } }
  else if (body.focus) { const el = document.getElementById(body.focus); if (el) el.focus(); }
}

function layerMsg(L) { return { title: L.title, html: `<p>${L.text}</p><button class="btn pri full" data-act="close">OK</button>` }; }

function layerHP(L) {
  const titles = { dmg: 'Take damage', heal: 'Heal', temp: 'Temporary HP' };

function startWizard() {

}
function wizCtx(L) {

  const w = L.w, c = S.c;

  if (w.invIn) invs.push(w.invIn);

  if (w.canOut) cans = cans.filter(x => x !== w.canOut);

  if (w.canIn) cans.push(w.canIn);

}
function invEligible(id, L, ctx, ignoreOwned) {
  const v = INV[id], lvl = L.L;

  if (v.needs === 'blade' && !ctx.invs.includes('pactBlade')) return 'Needs Pact of the Blade';

  if (v.needs === 'dmgCantrip' && !ctx.cans.some(x => DMG_CANTRIPS.includes(x))) return 'Needs a damaging warlock cantrip';

function choiceSelect(kind, id, value, key) {

    const opts = ctx.cans.filter(x => DMG_CANTRIPS.includes(x) && !taken.includes(x));

  }
  const owned = originFeats();
  const opts = Object.keys(ORIGIN_FEATS).filter(f => !owned.includes(f) || f === 'magicInitiate' || f === 'skilled');
  return `<select class="in" id="ch-${key}" data-wchoice="${key}"><option value="">Choose Origin feat</option>${opts.map(o => `<option value="${o}" ${value === o ? 'selected' : ''}>${ORIGIN_FEATS[o][0]}</option>`).join('')}</select>`;
}
function featPre(f) {
  const pre = f.pre, c = S.c, have = c.feats.map(x => x.id);
  if (/13\+$/.test(pre)) { const abs = pre.replace(' 13+', '').split(/, | or /).map(x => x.toLowerCase()); return abs.some(a => (c.abilities[a] || 0) >= 13) ? '' : 'needs ' + pre; }
  if (pre === 'Medium armor training') return have.includes('moderatelyArmored') ? '' : 'needs medium armor training';
  if (pre === 'Heavy armor training') return have.includes('heavilyArmored') ? '' : 'needs heavy armor training';
  if (pre === 'Shield training') return have.includes('lightlyArmored') || have.includes('moderatelyArmored') ? '' : 'needs shield training';

}
function abOptions(list, sel, cap) {

function wizValid(L) {

  if (step === 'asi') {
    if (w.asiMode === 'asi') return w.asiPlus2 ? c.abilities[w.asiA] <= 18 : (w.asiA && w.asiB && w.asiA !== w.asiB && c.abilities[w.asiA] < 20 && c.abilities[w.asiB] < 20);
    if (!w.feat || !w.featAb) return false;
    if (featPre(GF[w.feat])) return false;
    if (w.feat === 'skillExpert' && (!w.featSkill || !w.featExp)) return false;
    if (SKILL_FEATS[w.feat] && !w.featSkill) return false;

  if (step === 'spells') { const need = PREPARED[lvl] - PREPARED[lvl - 1]; return w.spAdd.length === need && (!w.spOut || !!w.spIn) && (!w.arcOut || !!w.arcIn); }

    if (id === 'mageArmor') c.mageArmor = true;
    if (s.c) { endConcentration(); c.conc = id; }
    if (id === 'armorAgathys') { const t = 5 * lv; c.agathys = t; if (t > c.temp) c.temp = t; }
    const dur = durText(id, lv);
    if (dur) { c.effects = c.effects.filter(e => e.sid !== id); c.effects.push({ sid: id, dur, target }); }
    const slotKind = { Action: 'action', Bonus: 'bonus', Reaction: 'reaction' }[s.t];
    if (slotKind) c.turn = Object.assign({}, c.turn, { [slotKind]: true });
    closeLayer(); commit();
    if (id === 'healingWord') openLayer({ type: 'roll', k: 'hwHeal', opts: { slot: via === 'slot' ? d.slotLvl : 1 } });
    else if (id === 'eldritchBlast') openLayer({ type: 'roll', k: 'sparkAtk' });
    else if (id === 'viciousMockery') openLayer({ type: 'roll', k: 'vmDmg' });
    else toast(`${s.n} cast.`);
  },
  item: el => openLayer({ type: 'item', id: el.dataset.id || '' }),
  itemSave: () => {
    const L = S.layer, f = L.form, c = S.c;
    const qty = Math.max(0, parseInt(f.qty, 10) || 0);
    if (!f.name.trim()) return;
    if (L.id) { const it = c.inventory.find(i => i.id === L.id); Object.assign(it, { name: f.name.trim(), qty, note: f.note.trim() }); }
    else c.inventory.push({ id: uid(), name: f.name.trim(), qty, note: f.note.trim() });
    closeLayer(); commit();
  },
  itemDel: () => { const L = S.layer; if (!L.confirm) { L.confirm = true; renderLayer(); return; } S.c.inventory = S.c.inventory.filter(i => i.id !== L.id); closeLayer(); commit(); },
  qty: el => { const it = S.c.inventory.find(i => i.id === el.dataset.id); if (!it) return; it.qty = Math.max(0, it.qty + +el.dataset.d); commit(); },
  note: el => openLayer({ type: 'note', id: el.dataset.id || '' }),
  noteTag: el => { S.noteTag = el.dataset.t; render(); },
  noteSave: async () => {
    const L = S.layer, f = L.form;
    const body = { title: f.title.trim(), tag: f.tag, body: f.body, updated: Date.now() };
    const existing = L.id ? allNotes().find(n => n.id === L.id) : null;
    const saveLocal = () => {
      const pend = readPending();
      const own = existing && existing.pending ? pend.find(p => p.id === existing.id) : null;
      if (own) Object.assign(own, body);
      else pend.push(Object.assign({ id: 'n' + Date.now().toString(36) + uid(), cloudId: existing ? existing.id : undefined, created: existing ? existing.created || Date.now() : Date.now() }, body));
      writePending(pend);
    };
    if (!S.notesCol || (existing && existing.pending)) {
      saveLocal(); closeLayer(); render();
      toast(S.notesCol ? 'Note saved.' : 'Saved on this device. It syncs when the app is back online.');
      syncPending(); return;
    }
    L.busy = true; L.err = ''; renderLayer();
    try {
      const id = existing ? existing.id : 'n' + Date.now().toString(36) + uid();
      await S.notesCol.doc(id).set(Object.assign({ created: existing && existing.created || Date.now() }, body));
      closeLayer(); render(); toast('Note saved.');
    } catch (e) {
      if (e && e.code === 'quota_exceeded') { L.busy = false; L.err = 'Storage is full. Delete some old notes and try again.'; renderLayer(); return; }
      saveLocal(); closeLayer(); render(); toast('Couldn\'t reach the cloud: saved on this device, it will sync later.');
    }
  },
  noteDel: async () => {
    const L = S.layer;
    if (!L.confirm) { L.confirm = true; renderLayer(); return; }
    const n = allNotes().find(x => x.id === L.id);
    if (n && n.pending) {
      writePending(readPending().filter(p => p.id !== n.id));
      if (n.cloudId && S.notesCol) { try { await S.notesCol.doc(n.cloudId).delete(); } catch (e) {} }
      closeLayer(); render(); toast('Note deleted.'); return;
    }
    if (!S.notesCol) { L.err = 'Deleting a synced note needs the cloud. Try again when online.'; L.confirm = false; renderLayer(); return; }
    try { await S.notesCol.doc(L.id).delete(); closeLayer(); render(); toast('Note deleted.'); }
    catch (e) { L.err = 'Couldn\'t delete the note. Try again.'; L.confirm = false; renderLayer(); }
  },
  levelUp: () => startWizard(),
  undoLevel: () => openLayer({ type: 'undo' }),
  undoDo: () => {
    const c = S.c, snap = c.history.pop();
    Object.assign(c, snap);
    const d = D(); c.hp = Math.min(c.hp, d.hpMax); c.slotsUsed = Math.min(c.slotsUsed, d.slots); c.hdSpent = Math.min(c.hdSpent, d.L);
    if (c.conc && !c.prepared.includes(c.conc) && !alwaysPrepared(d.L).includes(c.conc) && !Object.values(c.arcanum).includes(c.conc)) c.conc = null;
    closeLayer(); commit(); toast(`Back to level ${c.level}.`);
  },
  w: el => {
    const L = S.layer, k = el.dataset.k; let v = el.dataset.v;
    if (k === 'asiPlus2') v = v === '1';
    L.w[k] = v;
    if (k === 'asiMode' || k === 'asiPlus2') { L.w.asiB = ''; }
    renderLayer();
  },
  wToggle: el => {
    const L = S.layer, list = L.w[el.dataset.list], id = el.dataset.id;
    const i = list.indexOf(id); if (i >= 0) { list.splice(i, 1); delete L.w.invChoice[id]; } else list.push(id);
    renderLayer();
  },
  wNext: () => { const L = S.layer; if (!wizValid(L)) return; L.i = Math.min(L.steps.length - 1, L.i + 1); const sh = $('#layer .sheet'); renderLayer(); if (sh) { const n = $('#layer .sheet'); if (n) n.scrollTop = 0; } },
  wBack: () => { const L = S.layer; L.i = Math.max(0, L.i - 1); renderLayer(); const n = $('#layer .sheet'); if (n) n.scrollTop = 0; },
  wApply: () => { const L = S.layer; applyLevel(L); closeLayer(); commit(); toast(`Cletus is now level ${S.c.level}!`); },
  export: async () => {
    if (!S.dl) return;
    try { await S.dl.save({ filename: `cletus-level-${S.c.level}.json`, data: JSON.stringify(S.c, null, 2) }); }
    catch (e) { if (e && e.code !== 'declined') toast('Couldn\'t save the backup file here.'); }
  }
};

document.addEventListener('click', ev => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { const g = tab.dataset.tab; goTab(groupOf(S.tab) === g ? S.tab : S.lastSub[g]); return; }
  const sub = ev.target.closest('[data-sub]');
  if (sub) { goTab(sub.dataset.sub); return; }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'rollKind' || act === 'hwSlot') return; // handled on change
  if (el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'radio') return;
  if (act === 'ovClose' && ev.target !== el) return;
  const fn = ACTIONS[act];
  if (fn) { if (el.tagName === 'INPUT') { /* let checkbox/radio settle */ } else ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'rollKind') { resetRoll(S.layer, el.value); renderLayer(); return; }
  if (el.id === 'hwSlot') { S.layer.opts.slot = +el.value; renderLayer(); return; }
  if (el.dataset.coin) { const v = Math.max(0, parseInt(el.value, 10) || 0); S.c.coins[el.dataset.coin] = v; commit(); return; }
  if (el.id === 'importFile') { importFile(el.files && el.files[0]); el.value = ''; return; }
  if (el.id === 'coinType') { S.coinType = el.value; return; }
  if (el.dataset.wk && S.layer && S.layer.type === 'level' && el.tagName === 'INPUT') { S.layer.w[el.dataset.wk] = el.value; return; }
  if (el.dataset.wk && S.layer && S.layer.type === 'level') { S.layer.w[el.dataset.wk] = el.value; if (el.dataset.wk === 'invOut') { S.layer.w.invIn = ''; S.layer.w.invInChoice = ''; } if (el.dataset.wk === 'invIn') S.layer.w.invInChoice = ''; if (el.dataset.wk === 'canOut') S.layer.w.canIn = ''; if (el.dataset.wk === 'spOut') S.layer.w.spIn = ''; if (el.dataset.wk === 'arcOut') S.layer.w.arcIn = ''; if (el.dataset.wk === 'feat') { S.layer.w.featAb = ''; S.layer.w.featSkill = ''; S.layer.w.featExp = ''; } renderLayer(); return; }
  if (el.dataset.wchoice && S.layer && S.layer.type === 'level') { const k = el.dataset.wchoice; if (k === '__in') S.layer.w.invInChoice = el.value; else S.layer.w.invChoice[k] = el.value; renderLayer(); return; }
  if (el.dataset.f && S.layer && S.layer.form) { S.layer.form[el.dataset.f] = el.value; } // no redraw: it would swallow the tap on Save
});
document.addEventListener('input', ev => {
  const el = ev.target, L = S.layer;
  if (el.id === 'noteSearch') { S.noteQuery = el.value; render(); return; }
  if (el.id === 'coinAmt') { S.coinAmt = el.value; return; }
  if (!L) return;
  if (L.type === 'roll') {
    if (el.id === 'd1') L.d1 = el.value; else if (el.id === 'd2') L.d2 = el.value; else if (el.id === 'concDmg') L.concDmg = el.value; else if (el.id === 'blessV') L.blessV = el.value; else if (el.id === 'bonusV') L.bonusV = el.value;
    else if (el.dataset.dv) L.vals[el.dataset.dv] = el.value; else return;
    renderLayer(); return;
  }
  if (L.type === 'hp' && el.id === 'hpAmt') { L.v = el.value; return; }
  if (L.type === 'cast' && el.id === 'castTarget') { L.target = el.value; return; }
  if (L.type === 'short' && el.id === 'srRoll') { L.roll = el.value; renderLayer(); return; }
  if (L.type === 'level' && el.dataset.wk) { L.w[el.dataset.wk] = el.value; renderLayer(); return; }
  if (el.dataset.f && L.form) { L.form[el.dataset.f] = el.value; const btn = $('#layer [data-act="itemSave"], #layer [data-act="noteSave"]'); if (btn) btn.disabled = L.type === 'item' ? !L.form.name.trim() : !(L.form.title.trim() || L.form.body.trim()); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.layer) closeLayer();
  if (ev.key === 'Enter' && S.layer && S.layer.type === 'hp' && ev.target.id === 'hpAmt') { ev.preventDefault(); ACTIONS.hpApply(); }
});

function importFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || typeof data !== 'object' || !data.abilities || !data.level || !Array.isArray(data.invocations)) throw new Error('bad');
      if (!S.c) { S.c = upgrade(clone(data)); fixHp(); S.conn = S.docRef ? 'cloud' : 'local'; commit(); toast(`Restored Cletus at level ${S.c.level}.`); return; }
      openLayer({ type: 'importConfirm', data });
    } catch (e) { openLayer({ type: 'msg', title: 'Couldn\'t restore', text: 'That file isn\'t a Cletus backup. Pick a .json file saved from this app.' }); }
  };
  r.readAsText(file);
}
window.addEventListener('online', () => { if (S.dirty) flush(); syncPending(); });
window.addEventListener('pagehide', () => { if (S.dirty) flush(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S.dirty) flush(); });

boot();
})();
</script>
